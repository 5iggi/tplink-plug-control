<div class="lb-content tplink-page"><style>
.tplink-page { max-width: 1100px; }
.tplink-actions { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:1rem 0; }
/* Kein weißer Karten-Hintergrund mehr - Layout bleibt bewusst flach wie klassische LoxBerry/JQM-Seiten. */
.tplink-card { padding:1rem; border:1px solid #ddd; border-radius:10px; margin:1rem 0; background:transparent; }
.tplink-card .tplink-actions button.ui-icon-alert { color: darkred; background-color: #f7e3e3; border-color: #7e7e7e; }
.tplink-card .hint { color: darkred; }
.tplink-row { display:grid; grid-template-columns:70px 1fr 180px 100px 190px; gap:.7rem; margin:.45rem 0; align-items:center; }
.tplink-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(275px,1fr)); gap:1rem; border:1px solid #ddd; border-radius:10px; padding:1rem; }
.tplink-panel { border: 1px solid #ddd; border-radius: 10px; margin: 1rem 0; background: transparent; padding: inherit; font-size: small; }
.tplink-kv { display: grid; grid-template-columns: 110px 1fr; gap: .3rem; }
.tplink-row input.lb-input { width:100%; box-sizing:border-box; }
.tplink-active { display:flex; align-items:center; gap:.35rem; white-space:nowrap; }
/* JQM rendert die data-icon Buttons. switch-ui bleibt eigene Optik. */
.switch-button.ui-btn { display:inline-flex !important; align-items:center !important; gap:.6rem !important; min-width:190px !important; padding:.48em .85em !important; }
.switch-ui { display:inline-block; width:44px; height:24px; border-radius:999px; background:#c82333; vertical-align:middle; position:relative; box-shadow:inset 0 1px 3px rgba(0,0,0,.28); flex:0 0 44px; }
.switch-ui:after { content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:left .15s ease; }
.switch-button.is-on .switch-ui { background:#1f9d45; }
.switch-button.is-on .switch-ui:after { left:22px; }
.switch-button.is-off .switch-ui { background:#c82333; }
.switch-text { vertical-align:middle; }
@media(max-width:850px) { .tplink-row { grid-template-columns:1fr; } .tplink-page { max-width:100%; } }
</style>
