
<div class="lb-content tplink-page"><style>
.tplink-page { max-width: 1100px; }
.tplink-actions { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:1rem 0; }
/* Flaches LoxBerry/JQM Layout ohne weißen Karten-Hintergrund */
.tplink-card { padding:1rem; border:1px solid #ddd; border-radius:10px; margin:1rem 0; background:transparent; }
.tplink-discover-row {
  display:grid;
  grid-template-columns:32px minmax(260px,1fr) 180px minmax(120px,180px);
  gap:.7rem;
  margin:.45rem 0;
  align-items:center;
}
.tplink-discover-row input.lb-input { width:100%; box-sizing:border-box; }
.tplink-discover-check { display:flex; align-items:center; justify-content:center; }
.tplink-model { white-space:nowrap; }
@media(max-width:850px) {
  .tplink-discover-row { grid-template-columns:32px 1fr; }
  .tplink-model { grid-column:2; }
  .tplink-page { max-width:100%; }
}
</style>

<h2><TMPL_VAR COMMON.DISCOVERY></h2>
<TMPL_IF HAS_FOUND>
<form method="post" action="index.cgi">
  <input type="hidden" name="action" value="import_discovery">
  <div class="tplink-card">
    <TMPL_LOOP FOUND>
    <div class="tplink-discover-row">
      <div class="tplink-discover-check">
        <input data-role="none" type="checkbox" name="sel" value="<TMPL_VAR IDX>" checked>
      </div>
      <input data-role="none" class="lb-input" name="d_name_<TMPL_VAR IDX>" value="<TMPL_VAR NAME ESCAPE=HTML>">
      <input data-role="none" class="lb-input" name="d_ip_<TMPL_VAR IDX>" value="<TMPL_VAR IP ESCAPE=HTML>">
      <span class="tplink-model"><TMPL_VAR MODEL ESCAPE=HTML></span>
    </div>
    </TMPL_LOOP>
  </div>
  <div class="tplink-actions">
    <button style="width:150px;" type="submit" data-role="button" data-inline="true" data-icon="check" data-mini="true" data-transition="flow"><TMPL_VAR COMMON.IMPORT></button>
    <a style="width:90px;" href="index.cgi" data-role="button" data-inline="true" data-icon="back" data-mini="true" data-transition="flow"><TMPL_VAR COMMON.BACK></a>
  </div>
</form>
<TMPL_ELSE>
<p><TMPL_VAR COMMON.NO_DEVICES></p>
<div class="tplink-actions">
  <a style="width:90px;" href="index.cgi" data-role="button" data-inline="true" data-icon="back" data-mini="true" data-transition="flow"><TMPL_VAR COMMON.BACK></a>
</div>
</TMPL_IF>
</div>
